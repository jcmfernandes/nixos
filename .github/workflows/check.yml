name: "check"

on:
  push:

jobs:
  eval:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
      - uses: "DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25" # v22
        with:
          # Keep upstream Nix; since v21 the action defaults to Determinate Nix.
          determinate: false
      # Eval only, no builds: catches breakage in any host config without
      # needing an aarch64 builder for moon.
      - name: "Evaluate host configurations"
        run: |
          for dir in modules/nixos/hosts/*/; do
            host="$(basename "$dir")"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo " ${host} OK"
          done

  gitleaks:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          # Fetch the full history because gitleaks scans every commit.
          fetch-depth: 0
      - uses: "DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25" # v22
        with:
          # Keep upstream Nix; since v21 the action defaults to Determinate Nix.
          determinate: false
      - name: "Scan git history for leaked secrets"
        id: "gitleaks"
        run: "nix run nixpkgs#gitleaks -- detect --source . --config .gitleaks.toml --redact -v"
      # Push an ntfy alert if (and only if) the scan step failed, i.e. a leak
      # was found. The job still fails afterwards; the alert is an addition,
      # not a replacement.
      - name: "Notify on leaked secret"
        if: "${{ failure() && steps.gitleaks.outcome == 'failure' }}"
        env:
          NTFY_URL: "${{ secrets.NTFY_URL }}"
        run: |
          if [ -z "${NTFY_URL}" ]; then
            echo "NTFY_URL secret not set; skipping alert."
            exit 0
          fi
          curl -fsS \
            -H "Title: gitleaks found a secret in ${GITHUB_REPOSITORY}" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,lock" \
            -d "Branch ${GITHUB_REF_NAME} @ ${GITHUB_SHA} by ${GITHUB_ACTOR}. Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$NTFY_URL"
