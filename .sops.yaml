keys:
  - &yubikey age1yubikey1qw3y59t3sdzjgfpkh0pxyjxvk7vxuch09qlaec392gzegj7xcmf6kdd05uz
  - &backup  age1xf3tv4dn9c8xwafyppx9vlq86xrqe0rfw8tw7v59kd5sa9e6sg0qhn75jr
  - &moon    age1scpvuw3kgvsq3x0j7a4f62w6hzna6jewwc2fwuagl7z0pc4r2e9qwugy5g
  - &vivivi  age1y7p20wm4t3dujtwslhafwd95f8kclp4w434aeyh37h9dzccw7alswfdetv
  - &karma   age1nljp7tytctalypm76g63luycx0s0wl65ph22j3ez6gzp4zvjhudqgptm7l
  - &anuchka age1q9fwez7jjf7ys72j6vvqd7af99ecduwzw6e9epguj880uk3f34fqdhjguy

creation_rules:
  # Fleet-wide secrets: encrypted to every host, so any of them can decrypt
  # at activation. Deliberately narrow -- a secret here is readable by every
  # host key, so anything whose compromise would matter belongs in a
  # per-host file instead. See docs/secrets.md.
  - path_regex: secrets/common\.yaml$
    age:
      - *yubikey
      - *backup
      - *moon
      - *vivivi
      - *karma
      - *anuchka
  - path_regex: secrets/moon\.yaml$
    age:
      - *yubikey
      - *backup
      - *moon
  - path_regex: secrets/vivivi\.yaml$
    age:
      - *yubikey
      - *backup
      - *vivivi
  - path_regex: secrets/karma\.yaml$
    age:
      - *yubikey
      - *backup
      - *karma
  - path_regex: secrets/anuchka\.yaml$
    age:
      - *yubikey
      - *backup
      - *anuchka
  - path_regex: secrets/infra\.yaml$
    age:
      - *yubikey
      - *backup
